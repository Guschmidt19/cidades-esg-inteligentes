# =============================================================================
#  Pipeline CI/CD — Cidades ESG Inteligentes (API .NET 8)
#
#  Fluxo (push na branch main):
#    1. build-test         -> restore, build e testes automatizados (xUnit)
#    2. docker             -> build da imagem, sobe Docker Compose (API + Postgres),
#                             smoke test no container e publica no GHCR
#    3. deploy-staging     -> deploy da imagem no Render (staging) + smoke test
#    4. deploy-production  -> deploy da MESMA imagem no Render (produção)
#                             + smoke test (com aprovação manual, se configurada)
#
#  Pull requests para main executam apenas as etapas 1 e 2 (sem publicar/deploy).
# =============================================================================
name: CI/CD - Cidades ESG Inteligentes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Evita dois deploys simultâneos na mesma branch
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUILD + TESTES
  # ---------------------------------------------------------------------------
  build-test:
    name: "1. Build e testes (.NET 8)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências (NuGet)
        run: dotnet restore ESG.GestaoResiduos.sln

      - name: Build (Release)
        run: dotnet build ESG.GestaoResiduos.sln -c Release --no-restore

      - name: Executar testes automatizados (xUnit)
        run: >
          dotnet test ESG.GestaoResiduos.sln -c Release --no-build
          --logger "trx;LogFileName=resultado-testes.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Resumo dos testes
        if: always()
        run: python3 scripts/test-summary.py "TestResults/**/*.trx" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados dos testes (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2) DOCKER: build da imagem + teste com Docker Compose + publicação no GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: "2. Docker: build, compose e publicação"
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # GHCR exige letras minúsculas
          TAG="sha-${GITHUB_SHA::7}"               # tag imutável = commit
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagem: $IMAGE:$TAG"

      - name: Build da imagem Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            .
          docker image ls ${{ steps.meta.outputs.image }}

      - name: Subir ambiente com Docker Compose (API + PostgreSQL)
        env:
          API_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          APP_VERSION: ${{ steps.meta.outputs.tag }}
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          docker compose ps

      - name: Smoke test no container
        run: bash scripts/smoke-test.sh http://localhost:8080 --escrita --versao ${{ steps.meta.outputs.tag }}

      - name: Coletar logs do Docker Compose
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose-logs.txt || true
          tail -n 40 docker-compose-logs.txt || true

      - name: Publicar logs (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          retention-days: 30

      - name: Derrubar ambiente de teste
        if: always()
        run: docker compose down -v

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.image }}:latest
          {
            echo "## 🐳 Imagem publicada"
            echo ""
            echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3) DEPLOY STAGING (Render)
  #    Só roda na main e quando a variável STAGING_URL estiver configurada.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: "3. Deploy STAGING (Render)"
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}/swagger
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Disparar deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado no environment 'staging'."
            exit 1
          fi
          IMG_ENC=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")
          echo "Solicitando deploy da imagem $IMAGE ..."
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMG_ENC}"
          echo

      - name: Aguardar o Render publicar a nova versão
        run: bash scripts/wait-for-version.sh "${{ vars.STAGING_URL }}" "${{ needs.docker.outputs.tag }}" 900

      - name: Smoke test em STAGING (leitura + escrita)
        run: bash scripts/smoke-test.sh "${{ vars.STAGING_URL }}" --escrita --versao "${{ needs.docker.outputs.tag }}"

      - name: Resumo
        run: |
          {
            echo "## 🟡 Staging atualizado"
            echo "- Versão: \`${{ needs.docker.outputs.tag }}\`"
            echo "- Swagger: ${{ vars.STAGING_URL }}/swagger"
            echo "- Info: ${{ vars.STAGING_URL }}/api/info"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) DEPLOY PRODUÇÃO (Render)
  #    Promove a MESMA imagem testada em staging. Se o environment "production"
  #    tiver "Required reviewers", o GitHub pede aprovação manual aqui.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: "4. Deploy PRODUÇÃO (Render)"
    needs: [docker, deploy-staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}/swagger
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Disparar deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado no environment 'production'."
            exit 1
          fi
          IMG_ENC=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")
          echo "Solicitando deploy da imagem $IMAGE ..."
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMG_ENC}"
          echo

      - name: Aguardar o Render publicar a nova versão
        run: bash scripts/wait-for-version.sh "${{ vars.PRODUCTION_URL }}" "${{ needs.docker.outputs.tag }}" 900

      - name: Smoke test em PRODUÇÃO (somente leitura)
        run: bash scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}" --versao "${{ needs.docker.outputs.tag }}"

      - name: Resumo
        run: |
          {
            echo "## 🟢 Produção atualizada"
            echo "- Versão: \`${{ needs.docker.outputs.tag }}\`"
            echo "- Swagger: ${{ vars.PRODUCTION_URL }}/swagger"
            echo "- Info: ${{ vars.PRODUCTION_URL }}/api/info"
          } >> "$GITHUB_STEP_SUMMARY"
